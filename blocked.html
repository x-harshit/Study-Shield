<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blocked by Study Shield</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
            body {
                min-height: 100vh;
                background: #0f172a;
                color: #f8fafc;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
            }
            .card {
                width: 100%;
                max-width: 440px;
                background: #1e293b;
                border: 1px solid #334155;
                border-radius: 12px;
                padding: 28px;
                text-align: center;
            }
            h1 { font-size: 20px; color: #38bdf8; margin-bottom: 8px; }
            p { font-size: 14px; color: #94a3b8; line-height: 1.5; margin-bottom: 18px; }
            .stats {
                display: flex;
                justify-content: space-around;
                background: #0f172a;
                border: 1px solid #334155;
                border-radius: 8px;
                padding: 12px;
                margin-bottom: 18px;
                font-size: 12px;
                color: #94a3b8;
            }
            .stats strong { display: block; font-size: 18px; color: #f8fafc; font-variant-numeric: tabular-nums; margin-top: 2px; }
            .actions { display: flex; gap: 10px; }
            button {
                flex: 1;
                padding: 10px 14px;
                border-radius: 8px;
                border: none;
                font-size: 13px;
                font-weight: 600;
                cursor: pointer;
            }
            .btn-back { background: #38bdf8; color: #0f172a; }
            .btn-pass { background: #334155; color: #f8fafc; }
        </style>
    </head>
    <body>
        <main class="card">
            <h1>Study Mode Active</h1>
            <p>This site is on your distraction list while Study Shield is protecting your focus session.</p>
            <div class="stats">
                <div>Remaining<strong id="remainingText">25:00</strong></div>
                <div>Focus Streak<strong id="streakText">1 Day</strong></div>
            </div>
            <div class="actions">
                <button type="button" id="goBackBtn" class="btn-back">Return to Study</button>
                <button type="button" id="passBtn" class="btn-pass">5-Min Emergency Pass</button>
            </div>
        </main>
        <script src="blocked.js"></script>
    </body>
</html>
